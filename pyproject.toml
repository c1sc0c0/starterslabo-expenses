[project]
name = "starterslabo-expenses"
version = "0.1.0"
description = "Unofficial Playwright helpers for Starters Labo purchase expenses (aankoopfactuur SL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starterslabo"]
